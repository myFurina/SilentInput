[workspace]
resolver = "2"
members = [
    "crates/silentinput-core",
    "crates/silentinput-daemon",
    "crates/silentinput-cli",
    "crates/silentinput-gui",
]

[workspace.package]
version = "1.0.23"
edition = "2021"
license = "GPL-3.0"

[profile.release]
strip = "symbols"
opt-level = 3

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
evdev = "0.12"
futures-util = "0.3"
ipnet = "2.10"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = "0.13"
ring = "0.17"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"
subtle = "2.6"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = "0.24"
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
