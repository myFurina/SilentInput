[package]
name = "silentinput-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "silentinput-gui"
path = "src/main.rs"

[dependencies]
silentinput-core = { path = "../silentinput-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "advanced", "crisp", "x11", "wayland", "linux-theme-detection"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "process"] }
