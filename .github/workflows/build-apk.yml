name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-daemon:
    name: Test PC Daemon (Rust & Clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc-daemon-rs

      - name: Shell Script Syntax Check & Cargo Test + Clippy
        run: |
          bash -n pc-daemon/install.sh pc-daemon/uninstall.sh pc-daemon/packaging/scripts/postinstall.sh pc-daemon/packaging/scripts/preremove.sh pc-daemon/packaging/scripts/postremove.sh
          cd pc-daemon-rs
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

  package-linux:
    name: Package PC Daemon (.deb / .rpm / Arch - ${{ matrix.arch }})
    needs: test-daemon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            strip: strip
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Version
        id: ver
        run: |
          raw="${{ github.run_number }}"
          num=$(( raw - 30 ))
          if [ "$num" -lt 1 ]; then num=1; fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$num" >> "$GITHUB_OUTPUT"

      - name: Set up Rust Toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Linker for arm64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo Workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc-daemon-rs

      - name: Build Release Binaries (${{ matrix.arch }})
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --workspace --target "${{ matrix.target }}" --manifest-path pc-daemon-rs/Cargo.toml
          mkdir -p pc-daemon-rs/target/release
          for bin in silentinput silentinput-daemon silentinput-gui; do
            cp "pc-daemon-rs/target/${{ matrix.target }}/release/$bin" "pc-daemon-rs/target/release/$bin"
            "${{ matrix.strip }}" "pc-daemon-rs/target/release/$bin" || true
          done
          ls -lh pc-daemon-rs/target/release/silentinput*

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux Packages (${{ matrix.arch }})
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          nfpm package -f pc-daemon/packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f pc-daemon/packaging/nfpm.yaml -p rpm -t dist/
          nfpm package -f pc-daemon/packaging/nfpm.yaml -p archlinux -t dist/

          BUNDLE_DIR="$(mktemp -d)"
          mkdir -p "$BUNDLE_DIR/packaging"
          cp pc-daemon-rs/target/release/silentinput \
             pc-daemon-rs/target/release/silentinput-daemon \
             pc-daemon-rs/target/release/silentinput-gui \
             pc-daemon/install.sh \
             pc-daemon/uninstall.sh \
             "$BUNDLE_DIR/"
          cp pc-daemon/packaging/silentinput.service \
             pc-daemon/packaging/com.silentinput.controlcenter.desktop \
             pc-daemon/packaging/silentinput.svg \
             pc-daemon/packaging/60-silentinput-uinput.rules \
             "$BUNDLE_DIR/packaging/"
          tar -czf "dist/silentinput-linux-${{ matrix.arch }}.tar.gz" -C "$BUNDLE_DIR" .
          rm -rf "$BUNDLE_DIR"
          ls -lh dist/

      - name: Verify Debian Package Install & Uninstall (amd64)
        if: matrix.arch == 'amd64'
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          silentinput --help
          silentinput-daemon --help >/dev/null 2>&1 || true
          sudo apt-get remove -y silentinput

      - name: Upload Linux Packages Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build & Package APK
    needs: test-daemon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare Release Signing
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/silentinput-release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=${{ runner.temp }}/silentinput-release.p12" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          SIGNING_STORE_FILE: ${{ steps.sign.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build Debug APK (Fallback)
        if: steps.sign.outputs.signed != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [package-linux, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Compute Version
        id: ver
        run: |
          raw="${{ github.run_number }}"
          num=$(( raw - 30 ))
          if [ "$num" -lt 1 ]; then num=1; fi
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ steps.ver.outputs.num }}
          name: SilentInput v1.0.${{ steps.ver.outputs.num }}
          body: |
            - **手机端**：下载下方 **`app-release.apk`** 安装（后续版本可直接覆盖升级）。
            - **电脑端**：下载对应系统的 **`.deb`**（`sudo apt install ./silentinput_*.deb`）、**`.rpm`**（`sudo dnf install ./silentinput-*.rpm`）或 Arch 包，支持 `amd64` 与 `arm64`，零 Python/GTK 运行时依赖。
            - 支持 USB、局域网（TLS）与蓝牙三种连接方式。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
