name: Android CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare Release Signing
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/silentinput-release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=${{ runner.temp }}/silentinput-release.p12" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          SIGNING_STORE_FILE: ${{ steps.sign.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build Debug APK (Fallback)
        if: steps.sign.outputs.signed != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
